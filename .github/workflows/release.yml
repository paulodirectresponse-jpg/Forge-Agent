name: Release Forge Agent
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: forge-agent-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm version 0.1.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run package -- --publish never
      - name: Publish update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Forge Agent 0.1.${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/Forge Agent Setup *.exe
            dist/Forge Agent Setup *.exe.blockmap
            dist/latest.yml

